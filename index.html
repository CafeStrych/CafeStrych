<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Domowy Plan</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/style.css"></head><body>
<section id="authScreen" class="screen center"><div class="auth"><div class="logo">⌂</div><h1>Domowy Plan</h1><p class="muted">Grafik, rezerwacje i wspólna lista zakupów.</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" autocomplete="email" required><label>Hasło</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><button class="btn full">Zaloguj się</button></form><p id="authMsg" class="msg"></p><p class="muted">Konta tworzy administrator w panelu Supabase.</p></div></section>
<section id="appScreen" class="screen hidden"><div class="shell"><header><div class="brand"><b>Domowy Plan</b><small id="subtitle">Wspólna organizacja</small></div><div class="user"><span class="muted" id="userName"></span><div class="avatar" id="avatar">U</div><button class="btn alt" id="logout">Wyloguj</button></div></header><section class="hero"><h1 id="hello">Dzień dobry</h1><p class="muted">Wszystko w jednym miejscu, zawsze aktualne na każdym urządzeniu.</p><div class="stats"><div class="stat"><b id="s1">0</b><span>grafik</span></div><div class="stat"><b id="s2">0</b><span>rezerwacje</span></div><div class="stat"><b id="s3">0</b><span>zakupy</span></div></div></section><section class="card"><div id="notice" class="notice hidden"></div><div class="toolbar"><h2 id="viewTitle">Grafik</h2><button class="btn" id="addBtn">+ Dodaj</button></div><div id="list" class="list"></div></section></div><nav class="nav"><button data-view="shifts" class="active">📅<br>Grafik</button><button data-view="bookings">🔑<br>Rezerwacje</button><button data-view="shopping">🛒<br>Zakupy</button><button data-view="admin">⚙️<br>Panel</button></nav></section>
<dialog id="editor"><form id="editForm"><div class="dlghead"><h2 id="editorTitle">Nowy wpis</h2><button type="button" class="iconbtn" id="closeDlg">✕</button></div><input id="recordId" type="hidden"><label>Tytuł / nazwa</label><input id="title" maxlength="100" required><div class="grid2"><div><label>Data rozpoczęcia</label><input id="startAt" type="datetime-local"></div><div><label>Data zakończenia</label><input id="endAt" type="datetime-local"></div></div><label>Szczegóły</label><textarea id="details" maxlength="500"></textarea><label id="quantityLabel">Ilość</label><input id="quantity" maxlength="30"><button class="btn full">Zapisz</button></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="assets/app.js"></script></body></html>
