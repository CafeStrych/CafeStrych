<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a100b"><title>Cafe Strych • Panel</title><link rel="stylesheet" href="assets/style.css"></head><body>
<section id="auth" class="center"><div class="authbox"><div class="mark"><span>CAFE</span><b>STRYCH</b><small>GDYNIA • OD 1999</small></div><h1>Witaj na Strychu</h1><p>Grafik, rezerwacje i zakupy w jednym miejscu.</p><div class="tabs"><button class="active" data-tab="login">Logowanie</button><button data-tab="signup">Utwórz konto</button></div><form id="login"><label>E-mail</label><input id="le" type="email" required><label>Hasło</label><input id="lp" type="password" minlength="8" required><button>Zaloguj się</button></form><form id="signup" class="hide"><label>Imię i nazwisko</label><input id="sn" required maxlength="80"><label>E-mail</label><input id="se" type="email" required><label>Hasło</label><input id="sp" type="password" minlength="8" required><label>Powtórz hasło</label><input id="sp2" type="password" minlength="8" required><button>Utwórz konto</button></form><div id="msg"></div><small>Nowe konto otrzymuje rolę użytkownika.</small></div></section>
<section id="app" class="hide"><header><div><b>Cafe Strych</b><small>Panel zespołu • Gdynia</small></div><div><span id="who"></span><button id="out" class="ghost">Wyloguj</button></div></header><main><section class="hero"><h1 id="hello">Dzień dobry</h1><p>Kameralnie, rodzinnie i wszystko pod ręką.</p><div class="stats"><b id="c1">0<small>grafik</small></b><b id="c2">0<small>rezerwacje</small></b><b id="c3">0<small>zakupy</small></b></div></section><section class="card"><div class="bar"><h2 id="title">Grafik</h2><button id="add">+ Dodaj</button></div><div id="list"></div></section></main><nav><button class="active" data-view="shifts">📅<small>Grafik</small></button><button data-view="bookings">🔑<small>Rezerwacje</small></button><button data-view="shopping">🛒<small>Zakupy</small></button><button data-view="admin">⚙️<small>Panel</small></button></nav></section>
<dialog id="dlg"><form id="form"><div class="bar"><h2 id="dt">Nowy wpis</h2><button type="button" id="x" class="ghost">✕</button></div><input id="rid" type="hidden"><label>Nazwa</label><input id="name" maxlength="100" required><div id="dates"><label>Od</label><input id="start" type="datetime-local"><label>Do</label><input id="end" type="datetime-local"></div><div id="qty"><label>Ilość</label><input id="amount" maxlength="30"></div><label>Szczegóły</label><textarea id="details" maxlength="500"></textarea><button>Zapisz</button></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="assets/app.js"></script></body></html>
