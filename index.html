<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#180f0a"><title>Cafe Strych</title><style>
:root{--bg:#170e09;--panel:#2b1a12;--panel2:#382319;--gold:#d7a45a;--cream:#f5e8d3;--muted:#c1a889;--line:#704b31;--red:#d16e5e;--green:#83a96e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#1b100ae8,#170e09f5),repeating-linear-gradient(90deg,#44251a 0 2px,#24130d 2px 75px);color:var(--cream);font:15px system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}.hide{display:none!important}.center{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox,.panel,.summary,dialog{background:linear-gradient(145deg,#39251bdd,#21130fee);border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 65px #0009}.authbox{width:min(430px,100%);padding:25px;text-align:center}.logo{width:156px;height:156px;border-radius:50%;margin:auto;display:flex;flex-direction:column;justify-content:center;border:2px solid var(--gold);box-shadow:0 0 0 7px #40281a;background:#1b0f0a;color:#e8bf7b}.logo span{font:600 13px Georgia;letter-spacing:.35em;margin-left:.35em}.logo b{font:800 29px Georgia;letter-spacing:.08em}.logo small{font:600 9px Georgia;letter-spacing:.14em;margin-top:5px}h1,h2,.brand b{font-family:Georgia,serif}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#100906;padding:5px;border-radius:14px;margin:20px 0 6px}.tabs button{margin:0;background:none;color:var(--muted)}.tabs .active{background:#4b3020;color:var(--cream)}label{display:block;text-align:left;color:var(--muted);font-size:13px;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #7b5339;border-radius:12px;background:#160d09;color:var(--cream)}textarea{min-height:85px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary,.purchase{background:linear-gradient(135deg,#b97036,#dfba69);color:#21130c;margin-top:15px}.ghost{background:#ffffff0a;color:var(--cream);border:1px solid var(--line)}#msg{min-height:22px;color:#efaa95}header{max-width:1180px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;justify-content:space-between;align-items:center}.brand,.headUser,.row{display:flex;align-items:center;gap:10px}.mini-logo{width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font:700 17px Georgia;color:var(--gold);background:#21120c}.brand b{font-size:22px}.brand small,.summary small,.summary p,.muted,nav small{display:block;color:var(--muted)}main{max-width:1180px;margin:auto;padding:0 16px 105px}.summary{padding:20px;display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}.summary h1{margin:6px 0;font-size:23px}.purchase{margin:0}.panel{padding:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.toolbar h2{margin:0}.weeknav{display:flex;gap:6px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:9px;overflow:auto;padding-bottom:8px}.day{min-height:230px;background:#f0bd6b08;border:1px solid #d8a65c22;border-radius:16px;padding:10px}.day.today{border-color:var(--gold)}.day h3{margin:0 0 3px;font:700 15px Georgia}.day>small{color:var(--muted)}.shift{margin-top:8px;padding:9px;border-radius:11px;background:#6d452eaa;border:1px solid #d9aa6340}.shift b,.shift small{display:block}.dayAdd{width:100%;margin-top:9px;background:#ffffff0a;color:var(--cream);border:1px dashed #7b5339}.savebar{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.cards{display:grid;gap:10px}.card{display:flex;align-items:center;gap:10px;padding:13px;border-radius:15px;background:#f0bd6b08;border:1px solid #d8a65c22}.grow{flex:1}.card b,.card small{display:block}.actions{display:flex;gap:6px}.danger{background:#c84f3d22;color:#f2a699}.done{opacity:.58}.badge{font-size:11px;color:#ecc57f;padding:5px 8px;border-radius:99px;background:#d9aa6315}.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.setting{padding:15px;border-radius:16px;background:#f0bd6b08;border:1px solid #d8a65c22}.setting h3{margin-top:0}.roleRow{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;margin-top:8px}nav{position:fixed;z-index:5;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94%,650px);display:grid;grid-template-columns:repeat(4,1fr);padding:7px;background:#20120ef2;border:1px solid var(--line);border-radius:20px}nav button{background:none;color:var(--muted);padding:9px 3px}nav button.active{background:#c9873b1d;color:var(--cream)}dialog{width:min(92%,520px);color:var(--cream);padding:20px}dialog::backdrop{background:#000a}.row{justify-content:space-between}.row h2{margin:0}@media(max-width:720px){header #who{display:none}.summary{align-items:flex-start;flex-direction:column}.calendar{grid-template-columns:repeat(7,82vw)}.settingsGrid{grid-template-columns:1fr}.card{align-items:flex-start}.actions{flex-direction:column}.roleRow{grid-template-columns:1fr}}

.userMenuWrap{position:relative}.userMenuBtn{margin:0;display:flex;align-items:center;gap:7px;background:#2a1911;color:var(--cream);border:1px solid var(--line);padding:6px 9px}.userMenuBtn span{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#b97036,#dfba69);color:#21130c}.userMenu{position:absolute;right:0;top:48px;z-index:20;width:210px;padding:7px;background:#24150f;border:1px solid var(--line);border-radius:15px;box-shadow:0 16px 45px #000a}.userMenu button{width:100%;margin:0;text-align:left;background:transparent;color:var(--cream);padding:11px}.userMenu button:hover{background:#ffffff0b}.headUser{position:relative}

.nav3{grid-template-columns:repeat(3,1fr)}
.monthHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.monthGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{text-align:center;color:var(--muted);font-size:12px;padding:5px}.monthDay{min-height:125px;border:1px solid #d8a65c22;border-radius:13px;padding:8px;background:#f0bd6b08}.monthDay.other{opacity:.35}.monthDay.today{border-color:var(--gold)}.dayNo{font-weight:800}.bookingChip{margin-top:6px;padding:6px;border-radius:8px;background:#6b432c;color:var(--cream);font-size:11px;cursor:pointer}.bookingChip b,.bookingChip span{display:block}.formError{color:#f3a99d;margin-top:9px}.accountActions{display:grid;gap:10px;max-width:520px}.accountActions button{margin:0}.userMenuBtn{position:relative;z-index:21}@media(max-width:720px){.monthGrid{gap:4px}.monthDay{min-height:93px;padding:5px}.bookingChip{font-size:10px;padding:4px}.dow{font-size:10px}}
</style></head><body>
<section id="auth" class="center"><div class="authbox"><div class="logo"><span>CAFE</span><b>STRYCH</b><small>GDYNIA • OD 1999</small></div><h1>Panel Cafe Strych</h1><div class="tabs"><button class="active" data-auth="login">Logowanie</button><button data-auth="signup">Utwórz konto</button></div><form id="login"><label>E-mail</label><input id="le" type="email" required><label>Hasło</label><input id="lp" type="password" minlength="8" required><button class="primary">Zaloguj się</button></form><form id="signup" class="hide"><label>Imię i nazwisko</label><input id="sn" required><label>E-mail</label><input id="se" type="email" required><label>Hasło</label><input id="sp" type="password" minlength="8" required><label>Powtórz hasło</label><input id="sp2" type="password" minlength="8" required><button class="primary">Utwórz konto</button></form><p id="msg"></p></div></section>
<section id="app" class="hide"><header><div class="brand"><div class="mini-logo">CS</div><div><b>Cafe Strych</b><small>Panel zespołu</small></div></div><div class="headUser"><span id="who"></span><div class="userMenuWrap"><button id="userMenuBtn" class="userMenuBtn" aria-label="Menu użytkownika"><span id="userInitial">D</span>⌄</button><div id="userMenu" class="userMenu hide"><button id="adminSettings" class="hide">⚙ Ustawienia</button><button id="myAccount">👤 Moje konto</button><button id="reportBug">⚠ Zgłoś błąd</button><button id="out">↪ Wyloguj</button></div></div></div></header><main><section class="summary"><div><small>Twój następny dzień pracy</small><h1 id="nextShift">Brak zaplanowanej zmiany</h1><p id="nextShiftDetail">Grafik pojawi się tutaj po zapisaniu.</p></div><button id="quickBuy" class="purchase">＋ Potrzebny zakup</button></section><section id="content" class="panel"></section></main><nav class="nav3"><button data-view="schedule" class="active">📅<small>Grafik</small></button><button data-view="bookings">🔑<small>Rezerwacje</small></button><button data-view="shopping">📦<small>Produkty</small></button></nav></section>
<dialog id="modal"><form id="modalForm"><div class="row"><h2 id="modalTitle">Formularz</h2><button type="button" id="close" class="ghost">✕</button></div><div id="fields"></div><button class="primary">Zapisz</button></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const $=s=>document.querySelector(s),cfg=APP_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});const S={user:null,profile:null,view:'schedule',weekStart:null,profiles:[],employees:[],shifts:[],bookings:[],shopping:[],drafts:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>{let x=new Date(d),z=n=>String(n).padStart(2,'0');return `${x.getFullYear()}-${z(x.getMonth()+1)}-${z(x.getDate())}`};const pl=d=>new Intl.DateTimeFormat('pl-PL',{weekday:'short',day:'2-digit',month:'2-digit'}).format(new Date(d));const monday=d=>{let x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x};function message(x){$('#msg').textContent=x||''}document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-auth]').forEach(x=>x.classList.toggle('active',x===b));$('#login').classList.toggle('hide',b.dataset.auth!=='login');$('#signup').classList.toggle('hide',b.dataset.auth!=='signup');message('')});$('#login').onsubmit=async e=>{e.preventDefault();let {error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});message(error?error.message:'')};$('#signup').onsubmit=async e=>{e.preventDefault();if($('#sp').value!==$('#sp2').value)return message('Hasła nie są identyczne.');let {data,error}=await sb.auth.signUp({email:$('#se').value.trim(),password:$('#sp').value,options:{data:{full_name:$('#sn').value.trim()}}});message(error?error.message:(data.session?'Konto utworzone.':'Konto utworzone. Potwierdź adres e-mail.'))};$('#out').onclick=()=>sb.auth.signOut();$('#close').onclick=()=>$('#modal').close();$('#userMenuBtn').onclick=e=>{e.stopPropagation();$('#userMenu').classList.toggle('hide')};document.addEventListener('click',e=>{if(!e.target.closest('.userMenuWrap'))$('#userMenu').classList.add('hide')});$('#reportBug').onclick=()=>{ $('#userMenu').classList.add('hide'); bugForm() };$('#adminSettings').onclick=()=>{ $('#userMenu').classList.add('hide'); view('settings') };$('#myAccount').onclick=()=>{ $('#userMenu').classList.add('hide'); view('profile') };
async function boot(s){S.user=s?.user||null;$('#auth').classList.toggle('hide',!!S.user);$('#app').classList.toggle('hide',!S.user);if(!S.user)return;let {data,error}=await sb.from('profiles').select('*').eq('id',S.user.id).single();if(error)return alert(error.message);S.profile=data;$('#who').textContent=data.full_name;$('#userInitial').textContent=(data.full_name||'U')[0].toUpperCase();$('#adminSettings').classList.toggle('hide',data.role!=='admin');S.weekStart=monday(new Date());await load();renderNext();view('schedule')}
async function load(){let q=await Promise.all([sb.from('profiles').select('*').order('full_name'),sb.from('employees').select('*').eq('active',true).order('full_name'),sb.from('work_shifts').select('*,employees(full_name)').order('shift_date'),sb.from('bookings').select('*').order('start_at'),sb.from('shopping').select('*,profiles!created_by(full_name)').order('created_at',{ascending:false})]);for(let x of q)if(x.error)console.error(x.error);[S.profiles,S.employees,S.shifts,S.bookings,S.shopping]=q.map(x=>x.data||[])}
function renderNext(){let emp=S.employees.find(e=>e.profile_id===S.user.id),now=iso(new Date()),next=S.shifts.filter(x=>x.employee_id===emp?.id&&x.shift_date>=now).sort((a,b)=>a.shift_date.localeCompare(b.shift_date)||a.start_time.localeCompare(b.start_time))[0];$('#nextShift').textContent=next?new Intl.DateTimeFormat('pl-PL',{weekday:'long',day:'numeric',month:'long'}).format(new Date(next.shift_date+'T12:00')):'Brak zaplanowanej zmiany';$('#nextShiftDetail').textContent=next?`${next.start_time.slice(0,5)}–${next.end_time.slice(0,5)}`:'Grafik pojawi się tutaj po zapisaniu.'}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));function view(v){S.view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));({schedule:renderSchedule,bookings:renderBookings,shopping:renderShopping,settings:renderSettings,profile:renderProfile}[v])()}
function renderSchedule(){let end=new Date(S.weekStart);end.setDate(end.getDate()+6);$('#content').innerHTML=`<div class="toolbar"><div><h2>Grafik tygodniowy</h2><small class="muted">${pl(S.weekStart)} – ${pl(end)}</small></div><div class="weeknav"><button class="ghost" onclick="moveWeek(-7)">‹</button><button class="ghost" onclick="moveWeek(0)">Dziś</button><button class="ghost" onclick="moveWeek(7)">›</button>${S.profile.role==='admin'?'<button class="primary" onclick="employeeForm()">+ Pracownik</button>':''}</div></div><div class="calendar">${Array.from({length:7},(_,i)=>{let d=new Date(S.weekStart);d.setDate(d.getDate()+i);let ds=iso(d),rows=[...S.shifts.filter(x=>x.shift_date===ds),...S.drafts.filter(x=>x.shift_date===ds)];return `<section class="day ${ds===iso(new Date())?'today':''}"><h3>${new Intl.DateTimeFormat('pl-PL',{weekday:'long'}).format(d)}</h3><small>${new Intl.DateTimeFormat('pl-PL',{day:'numeric',month:'long'}).format(d)}</small>${rows.map(r=>`<div class="shift"><b>${esc(r.employees?.full_name||S.employees.find(e=>e.id===r.employee_id)?.full_name)}</b><small>${r.start_time.slice(0,5)}–${r.end_time.slice(0,5)}</small></div>`).join('')}<button class="dayAdd" onclick="shiftForm('${ds}')">+ Przydziel pracownika</button></section>`}).join('')}</div><div class="savebar"><button class="ghost" onclick="saveDrafts('day')">Zapisz wybrany dzień</button><button class="primary" onclick="saveDrafts('week')">Zapisz cały tydzień</button></div>`}
window.moveWeek=n=>{S.weekStart=n===0?monday(new Date()):new Date(S.weekStart.getFullYear(),S.weekStart.getMonth(),S.weekStart.getDate()+n);renderSchedule()};function field(id,label,type='text',extra=''){return `<label>${label}</label><input id="${id}" type="${type}" ${extra}>`}function openModal(title,html,submit){$('#modalTitle').textContent=title;$('#fields').innerHTML=html;$('#modalForm').onsubmit=async e=>{e.preventDefault();await submit()};$('#modal').showModal()}
window.shiftForm=date=>openModal('Przydziel pracownika',`<label>Pracownik</label><select id="fEmp">${S.employees.map(e=>`<option value="${e.id}">${esc(e.full_name)}</option>`).join('')}</select>${field('fStart','Od','time','value="12:00" required')}${field('fEnd','Do','time','value="20:00" required')}<input id="fDate" type="hidden" value="${date}">`,async()=>{let a=$('#fStart').value,b=$('#fEnd').value;if(b<=a)return alert('Godzina końca musi być późniejsza.');S.drafts.push({employee_id:$('#fEmp').value,shift_date:$('#fDate').value,start_time:a,end_time:b,created_by:S.user.id});$('#modal').close();renderSchedule()});window.saveDrafts=async scope=>{if(!S.drafts.length)return alert('Brak nowych zmian do zapisania.');let rows=scope==='week'?S.drafts:S.drafts.filter(x=>x.shift_date===prompt('Wpisz dzień do zapisania w formacie RRRR-MM-DD',iso(new Date())));if(!rows.length)return;let {error}=await sb.from('work_shifts').upsert(rows,{onConflict:'employee_id,shift_date'});if(error)return alert(error.message);S.drafts=S.drafts.filter(x=>!rows.includes(x));await load();renderNext();renderSchedule()};
window.employeeForm=()=>openModal('Dodaj pracownika',`${field('eName','Imię i nazwisko','','required')}<label>Powiąż z kontem (opcjonalnie)</label><select id="eProfile"><option value="">Bez konta</option>${S.profiles.map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join('')}</select>`,async()=>{let {error}=await sb.from('employees').insert({full_name:$('#eName').value.trim(),profile_id:$('#eProfile').value||null});if(error)return alert(error.message);$('#modal').close();await load();renderSchedule()});
let bookingMonth=new Date();bookingMonth.setDate(1);
function renderBookings(){const y=bookingMonth.getFullYear(),m=bookingMonth.getMonth(),first=new Date(y,m,1),gridStart=new Date(first),offset=(first.getDay()+6)%7;gridStart.setDate(first.getDate()-offset);const monthName=new Intl.DateTimeFormat('pl-PL',{month:'long',year:'numeric'}).format(first);let cells='';for(let i=0;i<42;i++){let d=new Date(gridStart);d.setDate(gridStart.getDate()+i);let ds=iso(d),items=S.bookings.filter(x=>x.start_at.slice(0,10)===ds);cells+=`<div class="monthDay ${d.getMonth()!==m?'other':''} ${ds===iso(new Date())?'today':''}"><span class="dayNo">${d.getDate()}</span>${items.map(x=>`<div class="bookingChip" title="${esc(x.title)}"><b>${new Date(x.start_at).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})} • ${esc(x.guests_count||'?')} os.</b><span>${esc(x.room||'Bez sali')}</span></div>`).join('')}</div>`}$('#content').innerHTML=`<div class="toolbar"><h2>Rezerwacje</h2><button class="primary" onclick="bookingForm()">+ Nowa rezerwacja</button></div><div class="monthHead"><button class="ghost" onclick="changeBookingMonth(-1)">‹</button><h2>${monthName}</h2><button class="ghost" onclick="changeBookingMonth(1)">›</button></div><div class="monthGrid">${['Pon','Wt','Śr','Czw','Pt','Sob','Nd'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>`}
window.changeBookingMonth=n=>{bookingMonth=new Date(bookingMonth.getFullYear(),bookingMonth.getMonth()+n,1);renderBookings()};
window.bookingForm=()=>openModal('Nowa rezerwacja',`${field('bTitle','Nazwisko / nazwa rezerwacji','','required')}${field('bGuests','Liczba osób','number','min="1" required')}<label>Strefa</label><select id="bRoom" required><option value="Mała salka">Mała salka</option><option value="Duża salka">Duża salka</option><option value="Góra">Góra</option></select>${field('bStart','Od','datetime-local','required')}${field('bEnd','Do','datetime-local','required')}<label>Szczegóły</label><textarea id="bDetails"></textarea><div id="bookingError" class="formError"></div>`,async()=>{const start=new Date($('#bStart').value),end=new Date($('#bEnd').value),room=$('#bRoom').value;if(!start.getTime()||!end.getTime()||end<=start){$('#bookingError').textContent='Sprawdź datę i godziny.';return}const overlap=S.bookings.some(x=>x.room===room&&new Date(x.start_at)<end&&new Date(x.end_at)>start);if(overlap){$('#bookingError').textContent='Ta strefa jest już zarezerwowana w wybranym terminie.';return}let {error}=await sb.from('bookings').insert({title:$('#bTitle').value.trim(),guests_count:Number($('#bGuests').value),room,start_at:start.toISOString(),end_at:end.toISOString(),details:$('#bDetails').value||null,created_by:S.user.id});if(error){$('#bookingError').textContent=error.message;return}$('#modal').close();await load();bookingMonth=new Date(start.getFullYear(),start.getMonth(),1);renderBookings()});
function renderShopping(){$('#content').innerHTML=`<div class="toolbar"><h2>Produkty</h2><button class="primary" onclick="purchaseForm()">+ Potrzebny produkt</button></div><div class="cards">${S.shopping.map(x=>`<div class="card ${x.is_done?'done':''}"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.quantity||'')} • zgłosił(a): ${esc(x.profiles?.full_name||'')}</small><small>${esc(x.details||'')}</small></div><button class="ghost" onclick="markPurchase('${x.id}',${!x.is_done})">${x.is_done?'Cofnij':'Kupione'}</button></div>`).join('')||'<div class="muted">Brak potrzebnych zakupów.</div>'}</div>`}window.purchaseForm=()=>openModal('Potrzebny produkt',`${field('pTitle','Co jest potrzebne?','','required')}${field('pQty','Ilość')}<label>Uwagi</label><textarea id="pDetails"></textarea>`,async()=>{let {error}=await sb.from('shopping').insert({title:$('#pTitle').value,quantity:$('#pQty').value||null,details:$('#pDetails').value||null,created_by:S.user.id});if(error)return alert(error.message);$('#modal').close();await load();renderShopping()});$('#quickBuy').onclick=()=>window.purchaseForm();window.markPurchase=async(id,v)=>{let {error}=await sb.from('shopping').update({is_done:v}).eq('id',id);if(error)return alert(error.message);await load();renderShopping()};
function renderProfile(){$('#content').innerHTML=`<div class="toolbar"><h2>Moje konto</h2></div><div class="setting"><h3>${esc(S.profile.full_name)}</h3><p class="muted">${esc(S.user.email)}</p><span class="badge">${S.profile.role==='admin'?'Administrator':'Użytkownik'}</span><div class="accountActions"><button class="ghost" onclick="changeEmailForm()">Zmień adres e-mail</button><button class="ghost" onclick="changePasswordForm()">Zmień hasło</button></div></div>`}
window.changeEmailForm=()=>openModal('Zmień adres e-mail',`${field('newEmail','Nowy adres e-mail','email','required')}`,async()=>{let {error}=await sb.auth.updateUser({email:$('#newEmail').value.trim()});if(error)return alert(error.message);$('#modal').close();alert('Sprawdź wiadomość potwierdzającą zmianę adresu.')});
window.changePasswordForm=()=>openModal('Zmień hasło',`${field('newPass','Nowe hasło','password','minlength="8" required')}${field('newPass2','Powtórz nowe hasło','password','minlength="8" required')}`,async()=>{if($('#newPass').value!==$('#newPass2').value)return alert('Hasła nie są identyczne.');let {error}=await sb.auth.updateUser({password:$('#newPass').value});if(error)return alert(error.message);$('#modal').close();alert('Hasło zostało zmienione.')});
function bugForm(){openModal('Zgłoś błąd',`<label>Temat</label><input id="bugTitle" required maxlength="120"><label>Co się stało?</label><textarea id="bugDetails" required maxlength="1200"></textarea>`,async()=>{let {error}=await sb.from('bug_reports').insert({title:$('#bugTitle').value.trim(),details:$('#bugDetails').value.trim(),created_by:S.user.id});if(error)return alert(error.message);$('#modal').close();alert('Zgłoszenie zostało zapisane.')})}
function renderSettings(){if(S.profile.role!=='admin'){$('#content').innerHTML='<h2>Ustawienia</h2><p class="muted">Ustawienia administracyjne są dostępne tylko dla administratora.</p>';return}$('#content').innerHTML=`<div class="toolbar"><h2>Ustawienia administratora</h2><span class="badge">Administrator: Daniel</span></div><div class="settingsGrid"><section class="setting"><h3>Użytkownicy i status konta</h3>${S.profiles.map(p=>`<div class="roleRow"><span>${esc(p.full_name)}<small>${esc(p.id===S.user.id?'Twoje konto':'')}</small></span><select onchange="changeRole('${p.id}',this.value)" ${p.id===S.user.id?'disabled':''}><option value="user" ${p.role==='user'?'selected':''}>Aktywny użytkownik</option><option value="admin" ${p.role==='admin'?'selected':''}>Administrator</option></select></div>`).join('')}</section><section class="setting"><h3>Pracownicy</h3><p class="muted">Dodawaj osoby do grafiku i opcjonalnie łącz je z kontami aplikacji.</p><button class="primary" onclick="employeeForm()">+ Dodaj pracownika</button></section></div>`}window.changeRole=async(id,role)=>{if(!confirm('Zmienić uprawnienia tego konta?'))return renderSettings();let {error}=await sb.from('profiles').update({role}).eq('id',id);if(error)return alert(error.message);await load();renderSettings()};sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>boot(s),0));sb.auth.getSession().then(({data})=>boot(data.session));

</script></body></html>
