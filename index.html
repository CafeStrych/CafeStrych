window.generateSchedule=async()=>{if(!canManage())return;let y=S.scheduleMode==='month'?S.month.getFullYear():S.week.getFullYear(),m=S.scheduleMode==='month'?S.month.getMonth():S.week.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=iso(first),end=iso(last),draft=[];for(let day=1;day<=last.getDate();day++){let d=new Date(y,m,day),ds=iso(d);if(d.getDay()===0)continue;let eligible=S.employees.filter(e=>!unavailable(e.id,ds)&&!S.shifts.some(x=>x.employee_id===e.id&&x.shift_date===ds)&&!draft.some(x=>x.employee_id===e.id&&x.shift_date===ds));eligible.sort((a,b)=>{let ah=monthHours(a.id,start,end)+draft.filter(x=>x.employee_id===a.id).length*8,bh=monthHours(b.id,start,end)+draft.filter(x=>x.employee_id===b.id).length*8;return ah/((a.weekly_target_hours||40)*4.348)-bh/((b.weekly_target_hours||40)*4.348)});if(eligible[0])draft.push({employee_id:eligible[0].id,shift_date:ds,start_time:'12:00',end_time:'20:00',created_by:S.user.id})}if(!draft.length)return alert('Brak zmian do wygenerowania.');if(!confirm(`Dodać ${draft.length} sugerowanych zmian?`))return;let{error}=await sb.from('work_shifts').insert(draft);if(error)return alert(error.message);await load();renderSchedule();toast('Zalecany grafik wygenerowany')};
function renderEmployees(){$('#content').innerHTML=`<div class="toolbar"><h2>Pracownicy</h2><button class="primary" onclick="employeeForm()">+ Dodaj pracownika</button></div><div class="list">${S.employees.map(e=>`<div class="card"><div class="grow"><b>${esc(e.full_name)}</b><small>${e.contract_percent||100}% • ${e.weekly_target_hours||40} h/tydz.</small></div><button class="ghost" onclick="employeeFormById('${e.id}')">Edytuj</button><button class="danger" onclick="deleteEmployee('${e.id}')">Usuń</button></div>`).join('')}</div>`}window.employeeFormById=id=>employeeForm(S.employees.find(e=>e.id===id));window.employeeForm=(r=null)=>modal(r?'Edytuj pracownika':'Dodaj pracownika',`${field('empName','Imię i nazwisko','','required')}<label>Etat</label><select id="empContract"><option value="100">100%</option><option value="75">75%</option><option value="50">50%</option><option value="25">25%</option></select><label>Powiązane konto</label><select id="empProfile"><option value="">Bez konta</option>${S.profiles.map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join('')}</select>`,async()=>{let pct=+$('#empContract').value,p={full_name:$('#empName').value.trim(),contract_percent:pct,weekly_target_hours:pct*.4,profile_id:$('#empProfile').value||null},q=r?sb.from('employees').update(p).eq('id',r.id):sb.from('employees').insert(p),{error}=await q;if(error)return alert(error.message);$('#dialog').close();await load();renderEmployees();toast(r?'Pracownik zaktualizowany':'Pracownik dodany')});window.deleteEmployee=async id=>{if(!confirm('Usunąć pracownika?'))return;let{error}=await sb.from('employees').delete().eq('id',id);if(error)return alert(error.message);await load();renderEmployees();toast('Pracownik usunięty')};
function renderSettings(){$('#content').innerHTML=`<div class="toolbar"><h2>Ustawienia administratora</h2></div><div class="list"><div class="card"><div class="grow"><b>Role kont</b><small>Administrator ma wszystkie funkcje kierownika oraz ustawienia administratora.</small></div></div>${S.profiles.map(p=>`<div class="card"><div class="grow"><b>${esc(p.full_name)}</b></div><select onchange="changeRole('${p.id}',this.value)" ${p.id===S.user.id?'disabled':''}><option value="user" ${p.role==='user'?'selected':''}>Pracownik</option><option value="manager" ${p.role==='manager'?'selected':''}>Kierownik</option><option value="admin" ${p.role==='admin'?'selected':''}>Administrator</option></select></div>`).join('')}<div class="card"><div class="grow"><b>Zgłoszone błędy</b><small>${S.bugs.length} zgłoszeń</small></div></div>${S.bugs.map(b=>`<div class="card"><div class="grow"><b>${esc(b.title)}</b><small>${esc(b.profiles?.full_name||'Użytkownik')} • ${new Date(b.created_at).toLocaleString('pl-PL')}</small><p>${esc(b.details)}</p></div><button class="danger" onclick="deleteBug('${b.id}')">Usuń</button></div>`).join('')||'<p class="muted">Brak zgłoszeń.</p>'}</div>`}window.changeRole=async(id,role)=>{let{error}=await sb.from('profiles').update({role}).eq('id',id);if(error)return alert(error.message);await load();renderSettings();toast('Rola zmieniona')};window.deleteBug=async id=>{if(!confirm('Usunąć zgłoszenie?'))return;let{error}=await sb.from('bug_reports').delete().eq('id',id);if(error)return alert(error.message);await load();renderSettings();toast('Zgłoszenie usunięte')};
function renderBookings(){$('#content').innerHTML=`<div class="toolbar"><h2>Rezerwacje</h2><div class="controls"><button class="ghost" onclick="moveBookingMonth(-1)">‹</button><button class="primary" onclick="bookingForm()">+ Rezerwacja</button><button class="ghost" onclick="moveBookingMonth(1)">›</button></div></div><div class="monthWrap"><div class="monthGrid">${['Pon','Wt','Śr','Czw','Pt','Sob','Nd'].map(x=>`<div class="dow">${x}</div>`).join('')}${monthCells(S.bookingMonth,ds=>S.bookings.filter(x=>x.start_at.slice(0,10)===ds).map(x=>`<div class="entry">${new Date(x.start_at).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})} • ${x.guests_count} os.<span>${esc(x.room)}</span></div>`),'openBookingDay')}</div></div>`}window.moveBookingMonth=n=>{S.bookingMonth=new Date(S.bookingMonth.getFullYear(),S.bookingMonth.getMonth()+n,1);renderBookings()};window.bookingForm=()=>{let t=new Date();t.setDate(t.getDate()+1);t.setHours(18,0,0,0);modal('Nowa rezerwacja',`${field('bookName','Nazwa','','required')}${field('bookGuests','Liczba osób','number','min="1" required')}<label>Strefa</label><select id="bookRoom"><option>Mała salka</option><option>Duża salka</option><option>Góra</option></select>${field('bookAt','Data i godzina','datetime-local',`value="${iso(t)}T18:00" required`)}`,async()=>{let a=new Date($('#bookAt').value),z=new Date(a.getTime()+7200000),room=$('#bookRoom').value,{error}=await sb.from('bookings').insert({title:$('#bookName').value,guests_count:+$('#bookGuests').value,room,start_at:a.toISOString(),end_at:z.toISOString(),created_by:S.user.id});if(error)return alert(error.message);$('#dialog').close();await load();renderBookings();toast('Rezerwacja dodana')})};window.openBookingDay=ds=>modal(new Date(ds+'T12:00').toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'}),`<div class="list">${S.bookings.filter(x=>x.start_at.slice(0,10)===ds).map(x=>`<div class="card"><div class="grow"><b>${esc(x.title)}</b><small>${new Date(x.start_at).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})} • ${x.guests_count} os. • ${esc(x.room)}</small></div></div>`).join('')||'<span class="muted">Brak rezerwacji</span>'}</div>`,async()=>{},false);
function renderProducts(){$('#content').innerHTML=`<div class="toolbar"><h2>Produkty</h2><button class="primary" onclick="productForm()">+ Dodaj</button></div><div class="list">${S.products.map(x=>`<div class="card"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.quantity||'')}</small></div></div>`).join('')}</div>`}window.productForm=()=>modal('Potrzebny produkt',`${field('prodName','Produkt','','required')}${field('prodQty','Ilość')}`,async()=>{let{error}=await sb.from('shopping').insert({title:$('#prodName').value,quantity:$('#prodQty').value,created_by:S.user.id});if(error)return alert(error.message);$('#dialog').close();await load();renderProducts();toast('Produkt dodany')});$('#quickProduct').onclick=()=>productForm();$('#settingsButton').onclick=()=>{if(S.profile.role==='admin')renderSettings()};$('#employeesButton').onclick=()=>{if(canManage())renderEmployees()};$('#accountButton').onclick=()=>toast('Moje konto');$('#leaveButton').onclick=()=>toast('Wolne zgłasza się z konta pracownika');$('#bugButton').onclick=()=>modal('Zgłoś błąd',`${field('bugTitle','Temat','','required')}<label>Opis</label><textarea id="bugDetails" required></textarea>`,async()=>{let{error}=await sb.from('bug_reports').insert({title:$('#bugTitle').value,details:$('#bugDetails').value,created_by:S.user.id});if(error)return alert(error.message);$('#dialog').close();toast('Błąd zgłoszony')});sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>boot(s),0));sb.auth.getSession().then(({data})=>boot(data.session));
</script></body></html>
