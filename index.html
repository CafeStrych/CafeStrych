rt({title:bn.value,guests_count:+bg.value,start_at:a.toISOString(),end_at:new Date(a.getTime()+7200000).toISOString(),room:'Góra'});if(error)return alert(error.message);await logAction('Dodano rezerwację','Rezerwacje',{title:bn.value});dlgEl.close();await load()});window.editBooking=id=>{let r=bookings.find(x=>x.id===id);M('Edytuj rezerwację',`<input id="bn" value="${esc(r.title)}"><input id="bg" type="number" value="${r.guests_count}">`,async()=>{let{error}=await sb.from('bookings').update({title:bn.value,guests_count:+bg.value}).eq('id',id);if(error)return alert(error.message);await logAction('Edytowano rezerwację','Rezerwacje',{id});dlgEl.close();await load()})};window.delBooking=async(id,ds)=>{let{error}=await sb.from('bookings').delete().eq('id',id);if(error)return alert(error.message);await logAction('Usunięto rezerwację','Rezerwacje',{id});await load();openDay(ds)};window.delShift=async id=>{let{error}=await sb.from('work_shifts').delete().eq('id',id);if(error)return alert(error.message);await logAction('Usunięto zmianę','Grafik',{id});await load()};window.productForm=()=>M('Produkt',`<input id="pn" placeholder="Nazwa"><input id="pq" placeholder="Ilość">`,async()=>{let{error}=await sb.from('shopping').insert({title:pn.value,quantity:pq.value});if(error)return alert(error.message);await logAction('Dodano produkt','Produkty',{title:pn.value});dlgEl.close();await load()});window.editProduct=id=>{let r=products.find(x=>x.id===id);M('Edytuj produkt',`<input id="pn" value="${esc(r.title)}"><input id="pq" value="${esc(r.quantity)}">`,async()=>{let{error}=await sb.from('shopping').update({title:pn.value,quantity:pq.value}).eq('id',id);if(error)return alert(error.message);await logAction('Edytowano produkt','Produkty',{id});dlgEl.close();await load()})};window.delProduct=async id=>{let{error}=await sb.from('shopping').delete().eq('id',id);if(error)return alert(error.message);await logAction('Usunięto produkt','Produkty',{id});await load()};async function start(){let{d
