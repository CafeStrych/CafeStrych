<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#180f0a"><title>Cafe Strych</title><link rel="stylesheet" href="assets/style.css"></head><body>
