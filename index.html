window.addShift=ds=>{const off=new Set(S.leave.filter(x=>x.status==='approved'&&ds>=x.start_date&&ds<=x.end_date).map(x=>x.employee_id)),available=S.employees.filter(e=>!off.has(e.id));openDialog('Dodaj pracownika',`<label>Pracownik</label><select id="shiftEmployee">${available.map(e=>`<option value="${e.id}">${esc(e.full_name)}</option>`).join('')}</select>${input('shiftStart','Od','time','value="12:00" required')}${input('shiftEnd','Do','time','value="20:00" required')}`,async()=>{let{error}=await sb.from('work_shifts').upsert({employee_id:$('#shiftEmployee').value,shift_date:ds,start_time:$('#shiftStart').value,end_time:$('#shiftEnd').value,created_by:S.user.id},{onConflict:'employee_id,shift_date'});if(error)return alert(error.message);await load();openScheduleDay(ds)});};window.saveShift=async(id,ds)=>{let{error}=await sb.from('work_shifts').update({start_time:$('#start_'+id).value,end_time:$('#end_'+id).value}).eq('id',id);if(error)return alert(error.message);await load();openScheduleDay(ds)};window.deleteShift=async(id,ds)=>{if(!confirm('Usunąć zmianę?'))return;let{error}=await sb.from('work_shifts').delete().eq('id',id);if(error)return alert(error.message);await load();openScheduleDay(ds)};
window.employeeForm=()=>openDialog('Dodaj pracownika',`${input('employeeName','Imię i nazwisko','','required')}<label>Etat</label><select id="employeeContract"><option value="100">100% • 40 h</option><option value="75">75% • 30 h</option><option value="50">50% • 20 h</option><option value="25">25% • 10 h</option></select><label>Powiąż z kontem</label><select id="employeeProfile"><option value="">Bez konta</option>${S.profiles.map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join('')}</select>`,async()=>{let c=Number($('#employeeContract').value),{error}=await sb.from('employees').insert({full_name:$('#employeeName').value.trim(),contract_percent:c,weekly_target_hours:c*.4,profile_id:$('#employeeProfile').value||null});if(error)return alert(error.message);$('#dialog').close();await load();renderSchedule()});window.deleteEmployee=async id=>{if(!confirm('Usunąć pracownika? Jego zapisane zmiany również mogą zostać usunięte.'))return;let{error}=await sb.from('employees').delete().eq('id',id);if(error)return alert(error.message);await load();renderSettings()};
function renderSettings(){const admin=S.profile.role==='admin',can=['admin','manager'].includes(S.profile.role);if(!can)return;$('#content').innerHTML=`<div class="toolbar"><h2>Ustawienia</h2></div><div class="settings-grid">${admin?`<section class="setting"><h3>Role kont</h3>${S.profiles.map(p=>`<div class="role-row"><span>${esc(p.full_name)}</span><select onchange="changeRole('${p.id}',this.value)" ${p.id===S.user.id?'disabled':''}><option value="user" ${p.role==='user'?'selected':''}>Pracownik</option><option value="manager" ${p.role==='manager'?'selected':''}>Kierownik</option><option value="admin" ${p.role==='admin'?'selected':''}>Administrator</option></select></div>`).join('')}</section>`:''}<section class="setting"><div class="toolbar"><h3>Pracownicy</h3><button class="primary" onclick="employeeForm()">+ Dodaj</button></div>${S.employees.map(e=>`<div class="role-row"><span><b>${esc(e.full_name)}</b><small>${e.contract_percent||100}% etatu</small></span><select onchange="changeContract('${e.id}',this.value)">${[100,75,50,25].map(v=>`<option value="${v}" ${e.contract_percent===v?'selected':''}>${v}%</option>`).join('')}</select><button class="danger" onclick="deleteEmployee('${e.id}')">Usuń</button></div>`).join('')}</section></div>`}window.changeRole=async(id,role)=>{let{error}=await sb.from('profiles').update({role}).eq('id',id);if(error)return alert(error.message);await load();renderSettings()};window.changeContract=async(id,v)=>{v=Number(v);let{error}=await sb.from('employees').update({contract_percent:v,weekly_target_hours:v*.4}).eq('id',id);if(error)return alert(error.message);await load();renderSettings()};
function renderProducts(){$('#content').innerHTML=`<div class="toolbar"><h2>Produkty</h2><button class="primary" onclick="productForm()">+ Potrzebny produkt</button></div><div class="list">${S.products.map(x=>`<div class="rowcard"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.quantity||'')} • ${esc(x.profiles?.full_name||'')}</small></div><button class="ghost" onclick="toggleProduct('${x.id}',${!x.is_done})">${x.is_done?'Cofnij':'Kupione'}</button></div>`).join('')}</div>`}window.productForm=()=>openDialog('Potrzebny produkt',`${input('productName','Produkt','','required')}${input('productQty','Ilość')}`,async()=>{let{error}=await sb.from('shopping').insert({title:$('#productName').value.trim(),quantity:$('#productQty').value,created_by:S.user.id});if(error)return alert(error.message);$('#dialog').close();await load();renderProducts()});$('#quickProduct').onclick=()=>productForm();window.toggleProduct=async(id,v)=>{await sb.from('shopping').update({is_done:v}).eq('id',id);await load();renderProducts()};
$('#settingsBtn').onclick=()=>showView('settings');$('#accountBtn').onclick=()=>openDialog('Moje konto',`<p>${esc(S.user?.email)}</p>${input('newEmail','Nowy e-mail','email')}${input('newPassword','Nowe hasło','password','minlength="8"')}`,async()=>{let p={};if($('#newEmail').value)p.email=$('#newEmail').value;if($('#newPassword').value)p.password=$('#newPassword').value;let{error}=await sb.auth.updateUser(p);if(error)return alert(error.message);$('#dialog').close();alert('Dane konta zaktualizowane.')});$('#leaveBtn').onclick=()=>{const e=S.employees.find(x=>x.profile_id===S.user.id);if(!e)return alert('Konto nie jest powiązane z pracownikiem.');openDialog('Zgłoś wolne',`${input('leaveStart','Od','date','required')}${input('leaveEnd','Do','date','required')}<label>Uwagi</label><textarea id="leaveNote"></textarea>`,async()=>{let{error}=await sb.from('time_off_requests').insert({employee_id:e.id,requested_by:S.user.id,start_date:$('#leaveStart').value,end_date:$('#leaveEnd').value,note:$('#leaveNote').value});if(error)return alert(error.message);$('#dialog').close();alert('Wniosek wysłany.')})};$('#bugBtn').onclick=()=>openDialog('Zgłoś błąd',`${input('bugTitle','Temat','','required')}<label>Opis</label><textarea id="bugDetails" required></textarea>`,async()=>{let{error}=await sb.from('bug_reports').insert({title:$('#bugTitle').value,details:$('#bugDetails').value,created_by:S.user.id});if(error)return alert(error.message);$('#dialog').close();alert('Zgłoszenie zapisane.')});
sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>boot(s),0));sb.auth.getSession().then(({data})=>boot(data.session));
</script></body></html>
